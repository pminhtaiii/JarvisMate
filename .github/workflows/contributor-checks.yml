name: Contributor checks

on:
  push:
    branches: [main, development]
  pull_request:
  workflow_dispatch:

concurrency:
  group: contributor-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contributor-checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Select pinned pnpm version
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          install: false
      - name: Install dependencies for test discovery
        run: pnpm install --frozen-lockfile
      - name: Check context consistency
        run: node scripts/ci/check-context.mjs
      - name: Check tracked files
        run: node scripts/ci/check-tracked-files.mjs
      - name: Lint repository JavaScript
        run: pnpm run lint
      - name: Test contributor helpers
        run: pnpm run test:contributors
